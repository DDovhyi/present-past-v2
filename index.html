    function loadState() {
      try {
        const saved = localStorage.getItem('pp_vs_ps_ukr_v2');
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            ...DEFAULT_STATE,
            ...parsed,
            task5: { ...DEFAULT_STATE.task5, ...(parsed.task5 || {}) }
          };
        }
      } catch (e) {
        console.warn('Не вдалося завантажити прогрес:', e);
      }
      return JSON.parse(JSON.stringify(DEFAULT_STATE));
    }

    function saveState() {
      try {
        localStorage.setItem('pp_vs_ps_ukr_v2', JSON.stringify(state));

        console.warn('Не вдалося зберегти прогрес:', e);

      updateHeaderStats();

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-800 text-white'
      };
      toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-xl shadow-lg text-sm font-semibold animate-pop pointer-events-auto flex items-center gap-2`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.3s ease';
        setTimeout(() => toast.remove(), 300);
      }, 2800);
    }

    function resetAllProgress() {
      state = JSON.parse(JSON.stringify(DEFAULT_STATE));

    function getSectionScore(sectionKey) {
      if (sectionKey === 'task5') {
        if (!state.task5.submitted) return 0;
        return Object.values(state.task5.answers || {}).filter(a => a && a.isCorrect).length;
      }
      const sectionData = state[sectionKey] || {};
      return Object.values(sectionData).filter(a => a && a.isCorrect).length;
    }

    function updateHeaderStats() {
      const maxStars = TABS.reduce((sum, tab) => sum + tab.maxScore, 0);
      const totalStars = ['task1', 'task2', 'task3', 'task4', 'task5'].reduce(
        (sum, key) => sum + getSectionScore(key),
        0
      );
      const percent = maxStars > 0 ? Math.round((totalStars / maxStars) * 100) : 0;

      const totalEl = document.getElementById('total-stars');
      const maxEl = document.getElementById('max-stars');
      const barEl = document.getElementById('global-progress-bar');
      const textEl = document.getElementById('global-progress-text');

      if (totalEl) totalEl.textContent = totalStars;
      if (maxEl) maxEl.textContent = maxStars;
      if (barEl) barEl.style.width = `${percent}%`;
      if (textEl) textEl.textContent = `${percent}%`;
    }

    function normalizeEnglish(str) {
      return str
        .toLowerCase()
        .replace(/[.,!?;:"'’`]/g, '')
        .replace(/\bive\b/g, 'i have')
        .replace(/\byouve\b/g, 'you have')
        .replace(/\bweve\b/g, 'we have')
        .replace(/\btheyve\b/g, 'they have')
        .replace(/\bhes\b/g, 'he has')
        .replace(/\bshes\b/g, 'she has')
        .replace(/\bhavent\b/g, 'have not')
        .replace(/\bhasnt\b/g, 'has not')
        .replace(/\bdidnt\b/g, 'did not')
        .replace(/\s+/g, ' ')
        .trim();
    }

                        ? '<span class="text-sm text-slate-400 font-medium">Натискай на слова нижче, щоб скласти переклад...</span>'

                              onclick="removeChipWord(${idx}, ${pos})"

                              title="Натисни, щоб прибрати слово"
                            >
                              ${item.words[wIdx]}

                    <div class="flex flex-wrap gap-2 mb-4">
                      ${item.words.map((word, wIdx) => {
                        const used = (entry.chipOrder || []).includes(wIdx);
                        return `
                          <button
                            onclick="addChipWord(${idx}, ${wIdx})"
                            ${used ? 'disabled' : ''}
                            class="px-3.5 py-2 rounded-xl border-2 font-bold text-sm transition-all ${
                              used
                                ? 'bg-slate-100 text-slate-300 border-slate-200 cursor-not-allowed'

                            ${word}

                    </div>
                  ` : `

                        value="${escapeHtml(isChecked ? (entry.userText || chipSentence) : entry.userText)}"
                        oninput="updateTask4Text(${idx}, this.value)"
                        onkeydown="if(event.key === 'Enter') checkTask4(${idx})"

                        placeholder="Напиши переклад англійською..."

                            ? 'bg-slate-50 border-slate-300 focus:border-indigo-500 focus:bg-white text-slate-900'
                            : entry.isCorrect
                              ? 'bg-emerald-50 border-emerald-400 text-emerald-950'
                              : 'bg-rose-50 border-rose-400 text-rose-950'
                        }"
                      />
                    </div>
                  `}

                  ${!isChecked ? `
                    <div class="flex items-center gap-3">

    function escapeHtml(str) {
      return (str || '').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function capitalizeSentence(str) {
      if (!str) return '';
      return str.charAt(0).toUpperCase() + str.slice(1) + '.';
    }

    function setTask4Mode(idx, mode) {
      const current = state.task4[idx] || { userText: '', checked: false, isCorrect: false, chipOrder: [] };
      state.task4[idx] = { ...current, mode };
      saveState();
      render();
    }

    function addChipWord(idx, wIdx) {
      const current = state.task4[idx] || { userText: '', checked: false, isCorrect: false, mode: 'chips', chipOrder: [] };
      const order = [...(current.chipOrder || []), wIdx];
      state.task4[idx] = { ...current, chipOrder: order };
      saveState();
      render();
    }

    function removeChipWord(idx, pos) {
      const current = state.task4[idx];
      if (!current) return;
      const order = [...(current.chipOrder || [])];
      order.splice(pos, 1);
      state.task4[idx] = { ...current, chipOrder: order };
      saveState();
      render();
    }

    function clearChips(idx) {
      const current = state.task4[idx];
      if (!current) return;
      state.task4[idx] = { ...current, chipOrder: [] };
      saveState();
      render();
    }

    function updateTask4Text(idx, val) {
      const current = state.task4[idx] || { checked: false, isCorrect: false, mode: 'type', chipOrder: [] };
      state.task4[idx] = { ...current, userText: val };
      try {
        localStorage.setItem('pp_vs_ps_ukr_v2', JSON.stringify(state));
      } catch (e) {}
    }

    function checkTask4(idx) {
      const item = TASK4_DATA[idx];
      const current = state.task4[idx] || { userText: '', mode: 'chips', chipOrder: [] };
      const mode = current.mode || 'chips';

      const rawAnswer = mode === 'chips'
        ? (current.chipOrder || []).map(wIdx => item.words[wIdx]).join(' ')
        : (current.userText || '');

      if (!rawAnswer.trim()) {
        showToast('Спочатку склади або введи речення!', 'info');
        return;
      }

      const normalizedUser = normalizeEnglish(rawAnswer);
      const isCorrect = item.answers.some(ans => normalizeEnglish(ans) === normalizedUser);

      state.task4[idx] = {
        ...current,
        userText: rawAnswer,
        checked: true,
        isCorrect
      };
      saveState();
      render();
      if (isCorrect) showToast('Блискучий переклад! +1 бал', 'success');
    }

    function renderTask5() {
      const answers = state.task5.answers || {};
      const submitted = state.task5.submitted;
      const answeredCount = Object.keys(answers).length;
      const total = TASK5_DATA.length;
      const score = getSectionScore('task5');

      let weakCategories = [];
      if (submitted) {
        const missedMap = {};
        TASK5_DATA.forEach((q, idx) => {
          if (!answers[idx] || !answers[idx].isCorrect) {
            missedMap[q.category] = (missedMap[q.category] || 0) + 1;
          }
        });
        weakCategories = Object.entries(missedMap);
      }

      return `
        <div class="space-y-6 animate-pop">
          <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">

                15 різнопланових питань на всі правила. Дай відповідь на всі питання та натисни <strong>«Завершити тест»</strong>.
              </p>
            </div>
            <div class="px-4 py-2 rounded-2xl bg-slate-100 text-slate-800 font-extrabold text-sm shrink-0">
              Відповідей: ${answeredCount} / ${total}
            </div>
          </div>

          ${submitted ? `
            <div class="bg-gradient-to-br from-indigo-900 to-slate-900 text-white rounded-3xl p-6 sm:p-8 shadow-lg animate-pop">
              <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-6">
                <div>
                  <span class="inline-block px-3 py-1 rounded-full bg-white/15 text-indigo-200 text-xs font-bold uppercase tracking-wider mb-2">
                    Результат фінального тесту
                  </span>
                  <h3 class="text-3xl sm:text-4xl font-extrabold mb-2">
                    ${score} з ${total} балів (${Math.round((score / total) * 100)}%)
                  </h3>
                  <p class="text-indigo-100 text-sm sm:text-base max-w-xl">
                    ${
                      score === total
                        ? 'Неймовірно! Ти бездоганно відчуваєш різницю між Present Perfect та Past Simple!'
                        : score >= 11
                          ? 'Чудовий результат! Ти впевнено орієнтуєшся в часах, залишилось шліфанути дрібниці.'
                          : score >= 8
                            ? 'Непоганий старт! Переглянь пояснення до помилок нижче — і наступного разу буде 15/15.'
                            : 'Варто ще раз зазирнути у вкладку «Теорія» та звернути увагу на слова-маркери. У тебе все вийде!'
                    }
                  </p>
                </div>

                <button
                  onclick="resetTask5()"
                  class="px-5 py-3 rounded-2xl bg-amber-400 hover:bg-amber-300 text-slate-950 font-extrabold text-sm shadow-md transition-all shrink-0"
                >
                  🔄 Спробувати ще раз
                </button>
              </div>

              ${weakCategories.length > 0 ? `
                <div class="mt-6 pt-5 border-t border-white/15">
                  <div class="text-xs font-bold uppercase tracking-wider text-amber-300 mb-2">
                    На що звернути увагу (теми з помилками):
                  </div>
                  <div class="flex flex-wrap gap-2">
                    ${weakCategories.map(([cat, count]) => `
                      <span class="px-3 py-1.5 rounded-xl bg-white/10 text-white text-xs font-bold">
                        ${cat} (${count} помил.)
                      </span>
                    `).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          ` : ''}

          <div class="space-y-4">
            ${TASK5_DATA.map((item, idx) => {
              const userAns = answers[idx];
              const selectedIdx = userAns ? userAns.selected : null;

              let cardBorder = 'border-slate-200';
              if (submitted) {
                cardBorder = userAns && userAns.isCorrect ? 'border-emerald-300 bg-emerald-50/15' : 'border-rose-300 bg-rose-50/15';
              } else if (selectedIdx !== null) {
                cardBorder = 'border-indigo-300';
              }

              return `
                <div class="bg-white rounded-2xl p-5 sm:p-6 border-2 transition-all ${cardBorder}">
                  <div class="flex items-center justify-between gap-2 mb-2">
                    <span class="text-xs font-extrabold text-slate-400">Питання ${idx + 1} з ${total}</span>
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-md bg-slate-100 text-slate-600">${item.category}</span>
                  </div>

                  <p class="text-lg font-extrabold text-slate-900 mb-4">
                    ${item.question}
                  </p>

                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
                    ${item.options.map((opt, optIdx) => {
                      let btnStyle = 'bg-slate-50 hover:bg-indigo-50 text-slate-800 border-slate-200';

                      if (!submitted) {
                        if (selectedIdx === optIdx) {
                          btnStyle = 'bg-indigo-600 text-white border-indigo-600 shadow-sm';
                        }
                      } else {
                        if (optIdx === item.correct) {
                          btnStyle = 'bg-emerald-600 text-white border-emerald-600';
                        } else if (selectedIdx === optIdx && optIdx !== item.correct) {
                          btnStyle = 'bg-rose-600 text-white border-rose-600';
                        } else {
                          btnStyle = 'bg-slate-50 text-slate-400 border-slate-200';
                        }
                      }

                      return `
                        <button
                          onclick="selectTask5Option(${idx}, ${optIdx})"
                          ${submitted ? 'disabled' : ''}
                          class="px-4 py-3 rounded-xl border-2 font-bold text-sm sm:text-base text-left transition-all ${btnStyle}"
                        >
                          ${opt}
                        </button>
                      `;
                    }).join('')}
                  </div>

                  ${submitted ? `
                    <div class="mt-4 p-3.5 rounded-xl text-sm ${
                      userAns && userAns.isCorrect
                        ? 'bg-emerald-50 text-emerald-950 border border-emerald-200'
                        : 'bg-rose-50 text-rose-950 border border-rose-200'
                    }">
                      💡 ${item.explanation}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          ${!submitted ? `
            <div class="bg-white rounded-3xl p-5 border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-4">
              <p class="text-sm text-slate-600 font-medium">
                ${answeredCount < total
                  ? `Залишилося відповісти ще на <strong>${total - answeredCount}</strong> пит.`
                  : 'Усі відповіді обрано! Можна перевіряти результат.'}
              </p>
              <button
                onclick="submitTask5()"
                class="w-full sm:w-auto px-7 py-3.5 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-base shadow-md transition-all"
              >
                Завершити тест і побачити результат
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function selectTask5Option(qIdx, optIdx) {
      if (state.task5.submitted) return;
      const isCorrect = optIdx === TASK5_DATA[qIdx].correct;
      state.task5.answers[qIdx] = { selected: optIdx, isCorrect };
      try {
        localStorage.setItem('pp_vs_ps_ukr_v2', JSON.stringify(state));
      } catch (e) {}
      render();
    }

    function submitTask5() {
      const answeredCount = Object.keys(state.task5.answers).length;
      if (answeredCount < TASK5_DATA.length) {
        showToast(`Дай відповідь на всі питання (залишилось ${TASK5_DATA.length - answeredCount})`, 'info');
        return;
      }
      state.task5.submitted = true;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      showToast('Фінальний тест завершено!', 'success');
    }

    function resetTask5() {
      state.task5 = { answers: {}, submitted: false };
      saveState();
      render();
    }

    function resetSection(sectionKey) {
      state[sectionKey] = {};
      saveState();
      render();
      showToast('Відповіді розділу скинуто', 'info');
    }

    function render() {
      renderNavTabs();
      const container = document.getElementById('app-content');

      switch (state.activeTab) {
        case 'theory':
          container.innerHTML = renderTheory();
          break;
        case 'task1':
          container.innerHTML = renderTask1();
          break;
        case 'task2':
          container.innerHTML = renderTask2();
          break;
        case 'task3':
          container.innerHTML = renderTask3();
          break;
        case 'task4':
          container.innerHTML = renderTask4();
          break;
        case 'task5':
          container.innerHTML = renderTask5();
          break;
        default:
          container.innerHTML = renderTheory();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      updateHeaderStats();
      render();
    });
  </script>
</body>
</html>
